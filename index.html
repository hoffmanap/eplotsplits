<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urban Lot Splitter & Capacity Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #0b0f19; overflow: hidden; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
        #map-canvas { height: 100%; width: 100%; min-height: 500px; }
    </style>
</head>
<body class="text-slate-100 font-sans antialiased selection:bg-teal-500">

    <header class="bg-slate-900/90 border-b border-slate-800 p-4 sticky top-0 z-50 flex justify-between items-center shadow-xl">
        <div class="flex items-center gap-3">
            <div class="h-8 w-8 bg-gradient-to-br from-teal-400 to-cyan-500 rounded-lg flex items-center justify-center">
                <span class="text-slate-900 font-black text-sm">📐</span>
            </div>
            <div>
                <h1 class="text-md font-bold text-slate-100 uppercase tracking-wider">Urban Lot Splitter</h1>
            </div>
        </div>
        <div class="flex gap-4">
            <div class="bg-slate-950/80 border border-slate-800 rounded-xl px-5 py-2 text-right">
                <span class="text-[9px] uppercase tracking-widest text-slate-400 block">Eligible Parcels</span>
                <span id="stat-eligible-count" class="text-xl font-bold text-teal-400 font-mono">0</span>
            </div>
            <div class="bg-slate-950/80 border border-slate-800 rounded-xl px-5 py-2 text-right">
                <span class="text-[9px] uppercase tracking-widest text-slate-400 block">Est. Housing Yield</span>
                <span id="stat-housing-yield" class="text-xl font-bold text-emerald-400 font-mono">0</span>
            </div>
        </div>
    </header>

    <main class="grid grid-cols-1 md:grid-cols-12 h-[calc(100vh-73px)]">
        
        <section class="md:col-span-4 bg-slate-900 border-r border-slate-800 flex flex-col h-full overflow-y-auto custom-scrollbar p-5">
            
            <h3 class="text-xs font-bold text-teal-400 tracking-widest uppercase mb-4 mt-2">1. Dimensional Constraints</h3>
            <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 mb-6">
                <div class="flex justify-between text-xs mb-2 font-mono">
                    <span class="text-slate-400">Min Parcel Size (sq ft)</span>
                    <span id="val-min-lot" class="text-teal-400 font-bold">2,500</span>
                </div>
                <input type="range" id="param-min-lot" min="1000" max="6000" step="250" value="2500" class="w-full mb-4 accent-teal-400 cursor-pointer">
                
                <div class="flex justify-between text-xs mb-2 font-mono">
                    <span class="text-slate-400">Min Lot Width (ft)</span>
                    <span id="val-min-width" class="text-teal-400 font-bold">25</span>
                </div>
                <input type="range" id="param-min-width" min="10" max="100" step="5" value="25" class="w-full accent-teal-400 cursor-pointer">
            </div>

            <h3 class="text-xs font-bold text-teal-400 tracking-widest uppercase mb-4">2. Categorical Scopes</h3>
            <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 mb-6 space-y-4">
                <div>
                    <label class="text-[10px] text-slate-400 uppercase tracking-widest block mb-1">Zoning Filter</label>
                    <select id="filter-zoning" class="w-full bg-slate-800 border border-slate-700 rounded text-xs p-2 text-slate-200 outline-none">
                        <option value="ALL">All Zoning</option>
                    </select>
                </div>
                <div>
                    <label class="text-[10px] text-slate-400 uppercase tracking-widest block mb-1">Context</label>
                    <select id="filter-context" class="w-full bg-slate-800 border border-slate-700 rounded text-xs p-2 text-slate-200 outline-none">
                        <option value="ALL">All Context</option>
                    </select>
                </div>
            </div>

            <h3 class="text-xs font-bold text-teal-400 tracking-widest uppercase mb-4">3. Constraints & Intersections</h3>
            <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-4">
                <label class="flex items-center gap-3 cursor-pointer">
                    <input type="checkbox" id="param-toggle-footprints" class="w-4 h-4 accent-red-500">
                    <span class="text-xs text-slate-300">Bldg area deduction <span class="text-[9px] text-slate-500">(Calculates Slower)</span></span>
                </label>
                <label class="flex items-center gap-3 cursor-pointer">
                    <input type="checkbox" id="param-toggle-historic" class="w-4 h-4 accent-amber-500">
                    <span class="text-xs text-slate-300">Exclude Historic Zones</span>
                </label>
            </div>
        </section>

        <section class="md:col-span-8 flex flex-col h-full relative">
            <div class="flex-grow relative border-b border-slate-800"><div id="map-canvas"></div></div>
            <div id="canvas-feedback" class="h-24 bg-slate-950 p-4 overflow-y-auto text-xs text-slate-400 font-mono flex items-center justify-center border-l border-slate-800">
                Awaiting Engine Mount...
            </div>
        </section>
    </main>

    <script>
        // Data & Maps
        let map;
        let parcelLayerGroup, hexLayerGroup, buildingLayer, historicLayer;
        let rawParcelsFeatures = [];
        let rawBuildingsGeoJSON = null;
        let rawHistoricGeoJSON = null;
        
        // UI Nodes
        const feedbackLog = document.getElementById('canvas-feedback');
        const statEligible = document.getElementById('stat-eligible-count');
        const statYield = document.getElementById('stat-housing-yield');
        const sldLot = document.getElementById('param-min-lot');
        const sldWidth = document.getElementById('param-min-width');
        const filterZoning = document.getElementById('filter-zoning');
        const filterContext = document.getElementById('filter-context');
        const chkBuildings = document.getElementById('param-toggle-footprints');
        const chkHistoric = document.getElementById('param-toggle-historic');

        let calcTimeout; // For debouncing calculations

        function initMap() {
            map = L.map('map-canvas', { center: [31.7619, -106.4850], zoom: 12, zoomControl: false });
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
            L.control.zoom({ position: 'topright' }).addTo(map);

            // Setup Layers
            parcelLayerGroup = L.layerGroup().addTo(map);
            hexLayerGroup = L.layerGroup().addTo(map);
            buildingLayer = L.geoJSON(null, { style: { color: '#ef4444', weight: 1, fillOpacity: 0.2 }, interactive: false }).addTo(map);
            historicLayer = L.geoJSON(null, { style: { color: '#f59e0b', weight: 1, dashArray: '4,4', fillOpacity: 0.1 }, interactive: false }).addTo(map);

            L.control.layers(null, { "Parcels": parcelLayerGroup, "Hexagons": hexLayerGroup }, { position: 'bottomright' }).addTo(map);

            // Bind Events using Debounce (Prevents UI Freezing while dragging)
            sldLot.addEventListener('input', (e) => { document.getElementById('val-min-lot').innerText = Number(e.target.value).toLocaleString(); debouncedCalc(); });
            sldWidth.addEventListener('input', (e) => { document.getElementById('val-min-width').innerText = e.target.value; debouncedCalc(); });
            filterZoning.addEventListener('change', debouncedCalc);
            filterContext.addEventListener('change', debouncedCalc);
            
            chkBuildings.addEventListener('change', () => {
                if(chkBuildings.checked && rawBuildingsGeoJSON) buildingLayer.addData(rawBuildingsGeoJSON);
                else buildingLayer.clearLayers();
                setFeedback("Re-processing footprint intersections...");
                debouncedCalc();
            });
            chkHistoric.addEventListener('change', () => {
                if(chkHistoric.checked && rawHistoricGeoJSON) historicLayer.addData(rawHistoricGeoJSON);
                else historicLayer.clearLayers();
                debouncedCalc();
            });

            executeLoadingSequence();
        }

        function setFeedback(msg, isError = false) {
            const color = isError ? 'text-rose-400' : 'text-teal-400';
            feedbackLog.innerHTML = `<span class="${color} animate-pulse">${msg}</span>`;
        }

        async function executeLoadingSequence() {
            try {
                // Step 1: Hexagons (Load Fast & Show Immediately)
                setFeedback("Step 1/3: Rendering Regional Hexagons...");
                for(let i=1; i<=5; i++) {
                    const res = await fetch(`data/el_paso_macro_hexagons_${i}.geojson`).catch(()=>null);
                    if(res && res.ok) {
                        const data = await res.json();
                        L.geoJSON(data, { style: { color: '#8b5cf6', weight: 1, fillOpacity: 0.05 }, interactive: false }).addTo(hexLayerGroup);
                    }
                }

                // Step 2: Static Context (Buildings & Historic)
                setFeedback("Step 2/3: Fetching Regulatory Context...");
                const [resBldg, resHist] = await Promise.all([
                    fetch('data/eligible_buildings.geojson').catch(()=>null),
                    fetch('data/historic.geojson').catch(()=>null)
                ]);
                if(resBldg && resBldg.ok) rawBuildingsGeoJSON = await resBldg.json();
                if(resHist && resHist.ok) rawHistoricGeoJSON = await resHist.json();

                // Step 3: Parcels (Heavy Data)
                setFeedback("Step 3/3: Importing Parcel Matrices. This may take a moment...");
                for(let i=1; i<=5; i++) {
                    const res = await fetch(`data/eligible_parcels_${i}.geojson`).catch(()=>null);
                    if(res && res.ok) {
                        const data = await res.json();
                        // Add base area to feature properties NOW to save Turf calculation time later
                        data.features.forEach(f => {
                            f.properties._baseArea = turf.area(f) * 10.7639;
                            rawParcelsFeatures.push(f);
                        });
                    }
                }

                // Auto-Populate the Dropdowns based on the loaded data
                populateDynamicDropdowns();

                setFeedback("Data Mount Complete. Running initial yield capacity matrix...");
                calculateLiveYields(); // Final Run

            } catch(e) {
                setFeedback(`Error loading data: ${e.message}`, true);
            }
        }

        function populateDynamicDropdowns() {
            let zones = new Set();
            let contexts = new Set();
            
            rawParcelsFeatures.forEach(f => {
                const z = f.properties.zoning || f.properties.ZONING;
                const c = f.properties.context || f.properties.CONTEXT;
                if(z) zones.add(z);
                if(c) contexts.add(c);
            });

            zones.forEach(z => { filterZoning.add(new Option(z, z)); });
            contexts.forEach(c => { filterContext.add(new Option(c, c)); });
        }

        // Debounce wrapper - Wait 400ms after user stops moving sliders before calculating
        function debouncedCalc() {
            clearTimeout(calcTimeout);
            calcTimeout = setTimeout(calculateLiveYields, 400);
        }

        function calculateLiveYields() {
            if(rawParcelsFeatures.length === 0) return;

            const minArea = parseFloat(sldLot.value);
            const activeZoning = filterZoning.value;
            const activeContext = filterContext.value;
            const checkBldg = chkBuildings.checked;
            const checkHist = chkHistoric.checked;

            let eligibleCount = 0;
            let yieldCount = 0;
            
            // Clear current map parcels
            parcelLayerGroup.clearLayers();
            let visibleFeatures = [];

            // "Fail-Fast" Calculation Loop
            for (let f of rawParcelsFeatures) {
                const props = f.properties;
                
                // 1. Skip instantly if wrong zoning/context (Lightning fast)
                const z = props.zoning || props.ZONING || "Unknown";
                const c = props.context || props.CONTEXT || "Unknown";
                if(activeZoning !== 'ALL' && z !== activeZoning) continue;
                if(activeContext !== 'ALL' && c !== activeContext) continue;

                // 2. Skip instantly if base area is too small before even looking at geometry
                let netArea = props._baseArea;
                if (netArea < (minArea * 2)) continue;

                // 3. Historic Check (Slower)
                let isHistoric = false;
                if (checkHist && rawHistoricGeoJSON) {
                    for(let block of rawHistoricGeoJSON.features) {
                        if(turf.booleanIntersects(f, block)) { isHistoric = true; break; }
                    }
                }
                if(isHistoric) continue;

                // 4. Footprint Check (Extremely Slow - only runs if parcel passed all above tests!)
                if (checkBldg && rawBuildingsGeoJSON) {
                    for (let bldg of rawBuildingsGeoJSON.features) {
                        if (turf.booleanIntersects(f, bldg)) {
                            try {
                                const overlap = turf.intersection(turf.featureCollection([f, bldg]));
                                if (overlap) netArea -= (turf.area(overlap) * 10.7639);
                            } catch(err) {}
                        }
                    }
                }

                // Final check: Is it still big enough after buildings are subtracted?
                if (netArea >= (minArea * 2)) {
                    eligibleCount++;
                    yieldCount += 2;
                    visibleFeatures.push(f);
                }
            }

            // Update UI
            statEligible.innerText = eligibleCount.toLocaleString();
            statYield.innerText = yieldCount.toLocaleString();

            // Render ONLY eligible parcels (Huge performance boost)
            L.geoJSON(visibleFeatures, {
                style: { color: '#0f766e', weight: 1, fillColor: '#14b8a6', fillOpacity: 0.4 },
                interactive: false
            }).addTo(parcelLayerGroup);

            feedbackLog.innerHTML = `<span class="text-slate-500 italic">Calculation complete. Displaying ${eligibleCount.toLocaleString()} eligible parcels.</span>`;
        }

        // Boot
        window.onload = initMap;
    </script>
</body>
</html>
