<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urban Lot Splitter & Capacity Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #0b0f19; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
        #map-canvas { height: 100%; width: 100%; min-height: 500px; }
    </style>
</head>
<body class="text-slate-100 font-sans antialiased overflow-hidden">
    <header class="bg-slate-900/90 border-b border-slate-800 p-4 sticky top-0 z-50 flex justify-between items-center">
        <h1 class="text-md font-bold text-teal-400 uppercase">Urban Lot Splitter</h1>
        <div class="flex gap-4">
            <div class="text-right"><span class="text-[9px] text-slate-400 uppercase">Eligible</span><br><span id="stat-eligible-count" class="text-xl font-bold">0</span></div>
            <div class="text-right"><span class="text-[9px] text-slate-400 uppercase">Yield</span><br><span id="stat-housing-yield" class="text-xl font-bold">0</span></div>
        </div>
    </header>

    <main class="grid grid-cols-12 h-[calc(100vh-73px)]">
        <section class="col-span-4 bg-slate-900 border-r border-slate-800 p-5 overflow-y-auto">
            <div class="space-y-4">
                <input type="range" id="param-min-lot" min="1000" max="6000" value="2500" class="w-full">
                <input type="range" id="param-min-width" min="10" max="100" value="25" class="w-full">
                <select id="filter-zoning" class="w-full bg-slate-800 p-2"><option value="ALL">All Zoning</option></select>
                <select id="filter-context" class="w-full bg-slate-800 p-2"><option value="ALL">All Context</option></select>
                <input type="checkbox" id="param-toggle-footprints"> Show Buildings
                <input type="checkbox" id="param-toggle-historic"> Show Historic
            </div>
        </section>
        <section class="col-span-8 relative">
            <div id="map-canvas"></div>
            <div id="canvas-feedback" class="p-4 bg-slate-950 text-xs"></div>
        </section>
    </main>

    <script>
        let map, parcelLayerGroup, hexLayerGroup, rawBuildingsGeoJSON, rawHistoricGeoJSON;
        let rawParcelsFeatures = []; // Consolidated array

        function initDashboard() {
            map = L.map('map-canvas').setView([31.7619, -106.4850], 12);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
            
            parcelLayerGroup = L.layerGroup().addTo(map);
            hexLayerGroup = L.layerGroup().addTo(map);
            
            // Re-bind your original event listeners
            document.getElementById('param-min-lot').addEventListener('input', calculateLiveYields);
            
            loadLocalSpatialAssets();
        }

        async function loadLocalSpatialAssets() {
            try {
                // Load split files
                for (let i = 1; i <= 5; i++) {
                    const res = await fetch(`data/eligible_parcels_${i}.geojson`);
                    if (res.ok) {
                        const data = await res.json();
                        rawParcelsFeatures.push(...data.features);
                        L.geoJSON(data).addTo(parcelLayerGroup);
                    }
                }
                for (let i = 1; i <= 5; i++) {
                    const res = await fetch(`data/el_paso_macro_hexagons_${i}.geojson`);
                    if (res.ok) {
                        const data = await res.json();
                        L.geoJSON(data, {style: {color: '#8b5cf6'}}).addTo(hexLayerGroup);
                    }
                }
            } catch (err) {
                console.error("Load error:", err);
            }
        }

        function calculateLiveYields() { /* Your original logic using rawParcelsFeatures */ }

        window.onload = initDashboard;
    </script>
</body>
</html>
