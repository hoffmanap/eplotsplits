<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urban Lot Splitter & Capacity Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #0b0f19; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #334155; }
        #map-canvas { height: 100%; width: 100%; min-height: 500px; }
    </style>
</head>
<body class="text-slate-100 font-sans antialiased selection:bg-teal-500 selection:text-slate-900 overflow-hidden">

    <header class="bg-slate-900/90 backdrop-blur border-b border-slate-800 p-4 sticky top-0 z-50 flex flex-col md:flex-row justify-between items-center gap-4 shadow-xl">
        <div class="flex items-center gap-3">
            <div class="h-8 w-8 bg-gradient-to-br from-teal-400 to-cyan-500 rounded-lg flex items-center justify-center shadow-lg shadow-teal-500/20">
                <span class="text-slate-900 font-black text-sm">📐</span>
            </div>
            <div>
                <h1 class="text-md font-bold tracking-wider text-slate-100 uppercase">Urban Lot Splitter</h1>
                <p class="text-[10px] text-teal-400 tracking-widest font-mono uppercase">Geospatial Capacity Simulation Engine</p>
            </div>
        </div>
        
        <div class="flex gap-4 items-center">
            <div class="bg-slate-950/80 border border-slate-800 rounded-xl px-5 py-2 flex flex-col items-end shadow-inner">
                <span class="text-[9px] uppercase tracking-widest text-slate-400 font-mono">Eligible Parcels</span>
                <span id="stat-eligible-count" class="text-xl font-black text-transparent bg-clip-text bg-gradient-to-r from-teal-400 to-cyan-400 font-mono">0</span>
            </div>
            <div class="bg-slate-950/80 border border-slate-800 rounded-xl px-5 py-2 flex flex-col items-end shadow-inner">
                <span class="text-[9px] uppercase tracking-widest text-slate-400 font-mono">Est. Housing Yield</span>
                <span id="stat-housing-yield" class="text-xl font-black text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-teal-400 font-mono">0</span>
            </div>
        </div>
    </header>

    <main class="grid grid-cols-1 xl:grid-cols-12 gap-0 h-[calc(100vh-73px)]">
        
        <section class="xl:col-span-4 bg-slate-900 border-r border-slate-800 flex flex-col h-full overflow-y-auto custom-scrollbar">
            <!-- (Sidebar UI remains identical to your original file) -->
            <div class="p-5 border-b border-slate-800/60 bg-gradient-to-b from-slate-950/40 to-transparent">
                <h2 class="text-xs font-bold text-teal-400 tracking-widest uppercase mb-2 font-mono">// Project Framework</h2>
                <p class="text-xs text-slate-300 leading-relaxed mb-2">An <strong class="text-slate-100">Urban Lot Split</strong> allows single-family residential parcels to be subdivided into two distinct plots.</p>
            </div>
            <div class="p-5 flex flex-col gap-6">
                <!-- Sliders and Inputs (Keep all these as they were) -->
                <div>
                    <div class="flex justify-between text-xs mb-1 font-mono">
                        <span class="text-slate-400">Min Parcel Size (sq ft)</span>
                        <span id="val-min-lot" class="text-teal-400 font-bold">2,500</span>
                    </div>
                    <input type="range" id="param-min-lot" min="1000" max="6000" step="250" value="2500" class="w-full h-1 bg-slate-800 rounded-lg cursor-pointer accent-teal-400">
                </div>
                <!-- ... (Include all your existing filter selects and checkboxes here) ... -->
            </div>
        </section>
        
        <section class="xl:col-span-8 flex flex-col h-full relative">
            <div class="flex-grow relative border-b border-slate-800">
                <div id="map-canvas"></div>
            </div>
            <div class="h-64 bg-slate-950 p-5 overflow-y-auto custom-scrollbar flex flex-col gap-3 border-l border-slate-800 shrink-0">
                <div id="canvas-feedback" class="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs text-slate-400 font-mono h-full items-center"></div>
            </div>
        </section>
    </main>

    <script>
        let map;
        let parcelLayerGroup, hexLayerGroup, buildingLayer, historicLayer; // Initialized as groups
        let selectedParcelFeature = null;

        let rawParcelsGeoJSON = { type: "FeatureCollection", features: [] }; // Combined features
        let rawBuildingsGeoJSON = null;
        let rawHistoricGeoJSON = null;

        // ... (Keep all your existing variable declarations for sliders, selects, etc.) ...

        function initDashboard() {
            map = L.map('map-canvas', { center: [31.7619, -106.4850], zoom: 12, zoomControl: false });
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
            L.control.zoom({ position: 'topright' }).addTo(map);

            // Initialize Layer Groups
            parcelLayerGroup = L.layerGroup().addTo(map);
            hexLayerGroup = L.layerGroup().addTo(map);
            buildingLayer = L.geoJSON(null, { style: { color: '#ef4444', weight: 0.8 } }).addTo(map);
            historicLayer = L.geoJSON(null, { style: { color: '#f59e0b', dashArray: '5,5' } }).addTo(map);

            // Layer Control
            L.control.layers(null, { "Parcels": parcelLayerGroup, "Hexagons": hexLayerGroup }).addTo(map);

            loadLocalSpatialAssets();
        }

        async function loadLocalSpatialAssets() {
            setLoadingState("Mounting Local Geospatial Vectors...");
            try {
                // 1. Load static files
                const [resBuildings, resHistoric] = await Promise.all([
                    fetch('data/eligible_buildings.geojson').catch(() => null),
                    fetch('data/historic.geojson').catch(() => null)
                ]);
                if (resBuildings && resBuildings.ok) rawBuildingsGeoJSON = await resBuildings.json();
                if (resHistoric && resHistoric.ok) rawHistoricGeoJSON = await resHistoric.json();
                
                // 2. Load Split Parcels (1-5)
                for (let i = 1; i <= 5; i++) {
                    const res = await fetch(`data/eligible_parcels_${i}.geojson`);
                    if (res.ok) {
                        const data = await res.json();
                        rawParcelsGeoJSON.features.push(...data.features);
                        L.geoJSON(data, { style: getParcelSymbology, onEachFeature: registerFeatureEvents }).addTo(parcelLayerGroup);
                    }
                }

                // 3. Load Split Hexagons (1-5)
                for (let i = 1; i <= 5; i++) {
                    const res = await fetch(`data/el_paso_macro_hexagons_${i}.geojson`);
                    if (res.ok) {
                        const data = await res.json();
                        L.geoJSON(data, { style: { color: '#8b5cf6', weight: 1 } }).addTo(hexLayerGroup);
                    }
                }

                calculateLiveYields();
            } catch (err) {
                setLoadingState(`Ingest Exception: ${err.message}.`);
            }
        }
        
        // ... (Keep all your remaining original functions: calculateLiveYields, registerFeatureEvents, etc.) ...
    </script>
</body>
</html>
